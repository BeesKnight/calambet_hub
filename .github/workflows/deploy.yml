name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: calambet-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            projects/learning_logs/requirements.txt
            projects/task_manager/requirements.txt
            projects/blog/requirements.txt

      - name: Check Learning Log
        working-directory: projects/learning_logs
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py test

      - name: Check Task Manager
        working-directory: projects/task_manager
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py test

      - name: Check Blog
        working-directory: projects/blog
        run: |
          python -m pip install -r requirements.txt
          python manage.py check
          python manage.py test

      - name: Validate compose
        run: docker compose --env-file .env.production.example config >/dev/null

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER || 'root' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/calambet_hub' }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate deploy configuration
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"

      - name: Install SSH key
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 30 -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Sync code to server
        run: |
          set -euo pipefail
          rsync -az --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            --exclude='node_modules/' \
            --exclude='.next/' \
            --exclude='.vinext/' \
            --exclude='.wrangler/' \
            --exclude='dist/' \
            --exclude='db.sqlite3' \
            --exclude='staticfiles/' \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Deploy on server
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$DEPLOY_PATH"

          if [[ ! -f .env.production ]]; then
            echo "Missing .env.production in $DEPLOY_PATH" >&2
            exit 1
          fi

          docker compose --env-file .env.production config >/dev/null
          docker compose --env-file .env.production up -d --build

          for service in hub learning_logs task_manager blog
          do
            for attempt in {1..30}; do
              if [[ "$service" == "hub" ]]; then
                health_command=(wget -qO- http://127.0.0.1/)
              else
                health_command=(python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)")
              fi

              if docker compose --env-file .env.production exec -T "$service" "${health_command[@]}" >/dev/null; then
                break
              fi
              if [[ "$attempt" == "30" ]]; then
                docker compose --env-file .env.production logs --tail=120 >&2
                echo "Healthcheck failed: $service" >&2
                exit 1
              fi
              sleep 2
            done
          done

          docker compose --env-file .env.production ps
          REMOTE_SCRIPT
