name: calambet

services:
  hub:
    container_name: calambet_hub
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HUB_BIND_IP:-127.0.0.1}:${HUB_PORT:-8080}:80"

  learning_logs:
    container_name: calambet_learning_logs
    build:
      context: ./projects/learning_logs
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${LEARNING_LOG_SECRET_KEY:?set LEARNING_LOG_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${LEARNING_LOG_ALLOWED_HOSTS:-log.trans-platform.com,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${LEARNING_LOG_CSRF_TRUSTED_ORIGINS:-https://log.trans-platform.com}
      SQLITE_PATH: /app/data/db.sqlite3
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn learning_log.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 2 \
          --timeout 60
    ports:
      - "${LEARNING_LOG_BIND_IP:-127.0.0.1}:${LEARNING_LOG_PORT:-8081}:8000"
    volumes:
      - learning_logs_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  task_manager:
    container_name: calambet_task_manager
    build:
      context: ./projects/task_manager
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${TASK_MANAGER_SECRET_KEY:?set TASK_MANAGER_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${TASK_MANAGER_ALLOWED_HOSTS:-tasks.trans-platform.com,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${TASK_MANAGER_CSRF_TRUSTED_ORIGINS:-https://tasks.trans-platform.com}
      SQLITE_PATH: /app/data/db.sqlite3
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn task_manager.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 2 \
          --timeout 60
    ports:
      - "${TASK_MANAGER_BIND_IP:-127.0.0.1}:${TASK_MANAGER_PORT:-8082}:8000"
    volumes:
      - task_manager_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  blog:
    container_name: calambet_blog
    build:
      context: ./projects/blog
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${BLOG_SECRET_KEY:?set BLOG_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${BLOG_ALLOWED_HOSTS:-blog.trans-platform.com,localhost,127.0.0.1}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${BLOG_CSRF_TRUSTED_ORIGINS:-https://blog.trans-platform.com}
      SQLITE_PATH: /app/data/db.sqlite3
    command:
      - sh
      - -c
      - |
        set -e
        python manage.py migrate --noinput
        python manage.py collectstatic --noinput
        exec gunicorn blog.wsgi:application \
          --bind 0.0.0.0:8000 \
          --workers 2 \
          --timeout 60
    ports:
      - "${BLOG_BIND_IP:-127.0.0.1}:${BLOG_PORT:-8083}:8000"
    volumes:
      - blog_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  learning_logs_data:
  task_manager_data:
  blog_data:

networks:
  default:
    external: true
    name: ${PROXY_NETWORK:-calambet_default}
